<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Pokémon - Franco Santino Di Vilio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/CSS/style.css">
</head>
<body>
    <h1>Enciclopedia de Pokémon</h1>

    <div class="controles">
        <input type="text" id="buscador" placeholder="Buscar por nombre...">
        
        <select id="filtroTipo">
            <option value="">Todos los tipos</option>
        </select>

        <select id="filtroGeneracion">
            <option value="">Todas las generaciones</option>
            <option value="gen1">Generación 1 (1 - 151)</option>
            <option value="gen2">Generación 2 (152 - 251)</option>
            <option value="gen3">Generación 3 (252 - 386)</option>
            <option value="gen4">Generación 4 (387 - 493)</option>
            <option value="gen5">Generación 5 (494 - 649)</option>
            <option value="gen6">Generación 6 (650 - 721)</option>
            <option value="gen7">Generación 7 (722 - 809)</option>
            <option value="gen8">Generación 8 (810 - 905)</option>
            <option value="gen9">Generación 9 (906 - 1025)</option>
        </select>

        <button id="btnAbrirQuiz" class="btn-quiz">Quiz Time!</button>
        
        <button id="btnAbrirComparador" class="btn-comparador">Comparador</button>
    </div>

    <div id="listaPokemon" class="grid-pokemon"></div>

    <div id="vistaDetalle" class="detalle-container oculto">
        <button id="btnVolver" class="btn-volver">Volver</button>
        <div id="detalleContenido"></div>
    </div>
    
    <div id="vistaQuiz" class="quiz-container oculto">
        <button id="btnVolverQuiz" class="btn-volver">Volver</button>
        <h2>¿Quién es este Pokémon?</h2>
        <div class="quiz-box">
            <img id="quizImagen" class="pokemon-silueta" src="" alt="Silueta Pokémon">
            <div id="quizPistas" class="quiz-pistas"><strong>Pista:</strong> ¡Adivina el Pokémon oculto!</div>
            <div class="quiz-input-group">
                <input type="text" id="quizInput" placeholder="Escribe el nombre...">
                <button id="quizBtnAdivinar">Adivinar</button>
            </div>
            <p id="quizResultado"></p>
            <p id="quizIntentos">Intentos restantes: 3</p>
        </div>
    </div>

    <div id="vistaComparador" class="comparador-container oculto">
        <button id="btnVolverComparador" class="btn-volver">Volver</button>
        <h2>Comparador de Pokémon (Hasta 3)</h2>
        
        <div class="selectores-comparador">
            <select id="compPokemon1" class="comp-select">
                <option value="">Seleccionar Pokémon 1</option>
            </select>
            <select id="compPokemon2" class="comp-select">
                <option value="">Seleccionar Pokémon 2</option>
            </select>
            <select id="compPokemon3" class="comp-select">
                <option value="">Seleccionar Pokémon 3</option>
            </select>
        </div>

        <button id="btnEjecutarComparacion" class="btn-comparar">Comparar Estadísticas</button>

        <div id="resultadoComparacion" class="resultado-comparacion"></div>
    </div>

</body>
<script type="module" src="main.js"></script>
</html>
